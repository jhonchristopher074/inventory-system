# Nightly backup of the Supabase project: every table's data, the structure
# (tables, database functions, policies), the roles, and the files in
# Storage (receipt photos, product pictures, documents, the logo).
# Then it checks that the money and stock add up (scripts/data-checks.sql).
#
# Supabase's free plan keeps no backups you can download, so this is the
# copy to restore from if something is deleted or broken. How to open and
# restore one: docs/BACKUPS.md.
#
# Each backup is kept for 30 days under Actions > Database backup > a run >
# Artifacts. This repo is public, so the file is encrypted: it can only be
# opened with BACKUP_PASSPHRASE.
#
# Needs two repository secrets (GitHub > Settings > Secrets and variables
# > Actions > New repository secret):
#   SUPABASE_ACCESS_TOKEN   Supabase > your account (top right) > Account
#                           preferences > Access Tokens > Generate new token
#                           (no database password needed; also backs up Storage)
#     or SUPABASE_DB_URL    Supabase > Connect > "Session pooler" connection
#                           string with the database password in it
#                           (the database only, no Storage files)
#   BACKUP_PASSPHRASE       a long password you make up. Keep it somewhere
#                           safe: without it the backups can't be opened.
# Until they're set, each run makes no backup and only shows a warning.
name: Database backup

on:
  schedule:
    - cron: '0 18 * * *' # every night, 2:00 AM Philippine time
  workflow_dispatch: # adds a "Run workflow" button for a backup right now

permissions:
  contents: read

env:
  PROJECT_REF: dvtnrfhsxabtcmpgojnn
  # the project's connection pooler (Supabase > Connect > Session pooler)
  POOLER_HOST: aws-1-ap-northeast-1.pooler.supabase.com

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check the secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ] || { [ -z "$TOKEN" ] && [ -z "$DB_URL" ]; }; then
            echo "::warning::No backup made: add the SUPABASE_ACCESS_TOKEN and BACKUP_PASSPHRASE secrets (see the top of backup.yml)."
            echo "SKIP_BACKUP=1" >> "$GITHUB_ENV"
          fi

      # pinned: CLI 3 changed the flags (--db-url became --remote=<url>)
      - if: env.SKIP_BACKUP != '1'
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Copy the database
        if: env.SKIP_BACKUP != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DB_URL" ]; then
            target="$DB_URL"
          else
            # GitHub's machines have no IPv6, and the database's own address
            # is IPv6 only, so connect through the pooler (IPv4). The token
            # makes a short-lived login for it (the same one the CLI makes
            # for itself); its password is hidden from this public log.
            curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/cli/login-role" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d '{"read_only": false}' -o login.json
            role=$(jq -r .role login.json)
            password=$(jq -r .password login.json)
            rm login.json
            echo "::add-mask::$password"
            password=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$password")
            echo "::add-mask::$password"
            echo "LOGIN_ROLE_MADE=1" >> "$GITHUB_ENV"
            target="postgresql://$role.$PROJECT_REF:$password@$POOLER_HOST:5432/postgres"
          fi
          mkdir backup
          supabase db dump --remote="$target" --yes -f backup/roles.sql --role-only
          supabase db dump --remote="$target" --yes -f backup/schema.sql
          # plain INSERTs (not COPY), so the SQL Editor can run it too
          supabase db dump --remote="$target" --yes -f backup/data.sql --data-only
          ls -la backup

      # the files in Storage (needs the access token). A problem here still
      # keeps the database backup.
      - name: Copy the Storage files
        if: env.SKIP_BACKUP != '1'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Storage files skipped: they need SUPABASE_ACCESS_TOKEN."
            exit 0
          fi
          mkdir -p backup/storage
          # the storage commands are "experimental" in CLI 3; the bucket list
          # comes as JSON (python reads it, as the CLI may print more than one)
          supabase storage ls ss:/// --remote="$PROJECT_REF" --experimental --output-format json > buckets.json
          python3 -c '
          import json, sys
          raw, dec, i = open(sys.argv[1]).read(), json.JSONDecoder(), 0
          while (i := raw.find("{", i)) >= 0:
              obj, i = dec.raw_decode(raw, i)
              for path in obj.get("paths", []): print(path)
          ' buckets.json | sed 's:/$::' | while IFS= read -r bucket; do
            [ -n "$bucket" ] || continue
            echo "Bucket: $bucket"
            # the "/" at the end copies the bucket's files into the folder itself
            supabase storage cp -r "ss:///$bucket/" "backup/storage/$bucket" --remote="$PROJECT_REF" --experimental -j 4 > /dev/null
          done
          rm buckets.json
          find backup/storage -type f | wc -l | xargs echo "Files copied:"
          du -sh backup/storage

      # remove the short-lived login (it would also expire by itself)
      - name: Remove the backup login
        if: always() && env.LOGIN_ROLE_MADE == '1'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -fsS -o /dev/null -X DELETE "https://api.supabase.com/v1/projects/$PROJECT_REF/cli/login-role" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

      - name: Encrypt it
        if: env.SKIP_BACKUP != '1'
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="database-backup-$(date -u +%F)"
          tar -czf backup.tar.gz backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" backup.tar.gz
          rm -rf backup backup.tar.gz
          ls -la "$name.tar.gz.gpg"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - if: env.SKIP_BACKUP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 30
          compression-level: 0 # already compressed and encrypted

      # Do the money and stock add up? (scripts/data-checks.sql, read-only)
      # A problem fails the run, and GitHub emails the repo's owner. Only the
      # check names and counts are shown: this repo's logs are public.
      - if: env.SKIP_BACKUP != '1'
        uses: actions/checkout@v4

      - name: Check the money and stock
        if: env.SKIP_BACKUP != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then target="$PROJECT_REF"; else target="$DB_URL"; fi
          supabase db query --remote="$target" --read-only -o json -f scripts/data-checks.sql > checks.json
          python3 - <<'PY'
          import json, os, sys
          # the CLI may print more than one JSON object: take the one with rows
          raw = open('checks.json', encoding='utf-8').read()
          dec, i, rows = json.JSONDecoder(), 0, None
          while rows is None:
              i = raw.index('{', i)
              obj, i = dec.raw_decode(raw, i)
              rows = obj.get('rows')
          bad = [r for r in rows if int(r['problems']) > 0]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Money and stock checks\n\n')
              for r in rows:
                  out.write(f"- {'❌' if int(r['problems']) else '✅'} {r['check_name']}: {r['problems']}\n")
          for r in rows:
              print(('PROBLEM ' if int(r['problems']) else 'ok      ') + f"{r['check_name']}: {r['problems']}")
          if bad:
              print('::error::Some money or stock numbers don\'t add up. Run scripts/data-checks.sql to see which.')
              sys.exit(1)
          PY
