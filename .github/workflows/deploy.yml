# Builds the app and uploads it over FTP to the web host on every push to main.
#
# Needs three repository secrets (GitHub > Settings > Secrets and variables
# > Actions > Secrets), copied from the host's FTP details:
#   FTP_SERVER    the FTP hostname, without "ftp://"
#                   Hostinger: hPanel > Files > FTP Accounts, e.g. 145.79.30.111
#                   InfinityFree: Control Panel > FTP Details, e.g. ftpupload.net
#   FTP_USERNAME  Hostinger: u123456789 (or u123456789.example.com); InfinityFree: if0_12345678
#   FTP_PASSWORD  the FTP password
#
# And one repository variable (same page > Variables), the website's folder
# as the FTP account sees it:
#   FTP_DIR       Hostinger: /public_html/ (or /domains/example.com/public_html/
#                 when the FTP account opens one level higher)
#                 InfinityFree: /htdocs/  (used when FTP_DIR isn't set)
#
# If the host refuses a connection now and then, open the failed run in the
# Actions tab and press "Re-run jobs".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# one upload at a time, so two quick pushes can't upload over each other
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Uploads only files that changed, and removes files from earlier
      # uploads that no longer exist (old assets/index-*.js etc.).
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || '/htdocs/' }}
