<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <!-- pinch-zoom allowed; form fields are 16px on phones so iPhones don't
         zoom in by themselves (style.css) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10 FIVE 7 Hardware</title>
    <!-- what Google shows under the title, and what a shared link shows in
         Messenger / Viber / Facebook -->
    <meta
      name="description"
      content="10 FIVE 7 Hardware: the store's system for inventory, point of sale, sales history and supplier receipts. Staff log in here."
    />
    <meta property="og:title" content="10 FIVE 7 Hardware" />
    <meta
      property="og:description"
      content="Inventory, point of sale and sales history for 10 FIVE 7 Hardware. Staff log in here."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0c" />
  </head>
  <body style="margin: 0; background: #000">
    <div id="app">
      <!-- shown until the app has started (the app replaces it) -->
      <div
        style="min-height: 100vh; display: grid; place-items: center; color: #71717a; font: 600 14px system-ui, sans-serif"
      >
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
